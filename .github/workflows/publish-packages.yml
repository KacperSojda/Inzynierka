name: Publish NuGet Packages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: read
      
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja srodowiska .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Autoryzacja serwera GitHub
        run: dotnet nuget update source "Inz_Git" --username "github-actions" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text || dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name "Inz_Git" --username "github-actions" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Twarda kompilacja bibliotek (Build)
        run: |
          dotnet build INZYNIERKA.Domain/INZYNIERKA.Domain.csproj -c Release
          dotnet build INZYNIERKA.Data/INZYNIERKA.Data.csproj -c Release
          dotnet build INZYNIERKA.Services/INZYNIERKA.Services.csproj -c Release

      - name: Pakowanie (Pack)
        run: |
          dotnet pack INZYNIERKA.Domain/INZYNIERKA.Domain.csproj -c Release --no-build -o ./out
          dotnet pack INZYNIERKA.Data/INZYNIERKA.Data.csproj -c Release --no-build -o ./out
          dotnet pack INZYNIERKA.Services/INZYNIERKA.Services.csproj -c Release --no-build -o ./out

      - name: Publikacja na GitHub Packages
        run: dotnet nuget push ./out/*.nupkg --source "Inz_Git" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate