name: Publish NuGet Packages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: read
      
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v3

      - name: Konfiguracja srodowiska .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Kompilacja i pakowanie projektow
        run: |
          dotnet pack INZYNIERKA.Domain/INZYNIERKA.Domain.csproj -c Release -o ./out
          dotnet pack INZYNIERKA.Data/INZYNIERKA.Data.csproj -c Release -o ./out
          dotnet pack INZYNIERKA.Services/INZYNIERKA.Services.csproj -c Release -o ./out

      - name: Publikacja paczek na GitHub Packages
        run: dotnet nuget push ./out/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate