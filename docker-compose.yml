services:
  web:
    build:
      context: .
      args:
        GITHUB_USERNAME: ${GITHUB_USERNAME}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "8080:80"
    environment:
      - ConnectionStrings__DefaultConnection=${HOST}

      - EmailConfiguration__SmtpServer=${SMTP_SERVER}
      - EmailConfiguration__SmtpPort=${SMTP_PORT}
      - EmailConfiguration__SmtpUsername=${SMTP_USERNAME}
      - EmailConfiguration__SmtpPassword=${SMTP_PASSWORD}

      - ApiKeys__Gemini=${API_KEY}

      - EndPoints__Gemini=${END_POINT}